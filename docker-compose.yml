services:
  unigate:
    build:
      context: .
      dockerfile: Dockerfile
    image: unigate:local
    container_name: unigate
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # WebUI 管理员（默认 admin/admin，务必修改）
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: admin
      # 下游是否强制通用 key（默认 true）
      # GW_KEY_AUTH: "true"
      # 故障转移冷却（可按需调整）
      # RATE_LIMIT_COOLDOWN: 1h
      # AUTH_FAIL_COOLDOWN: 10m
    volumes:
      - ./data:/data
