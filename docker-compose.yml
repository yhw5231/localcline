services:
  unigate:
    # 默认拉取官方镜像（ghcr.io），git pull 后 docker compose pull && up -d 即可在线更新；
    # 想本地构建改用：注释 image、取消 build 注释
    image: ghcr.io/yhw5231/localcline:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: unigate
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # 数据目录属主（启动时自动 chown /data 后以此身份运行；默认 100:100，
      # 与宿主机目录属主无关——bind mount 任意属主均可直接部署）
      # PUID: 1000
      # PGID: 1000
      # WebUI 管理员（默认 admin/admin，务必修改）
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: admin
      # 下游是否强制通用 key（默认 true）
      # GW_KEY_AUTH: "true"
      # 故障转移冷却（可按需调整）
      # RATE_LIMIT_COOLDOWN: 1h
      # AUTH_FAIL_COOLDOWN: 10m
    volumes:
      - ./data:/data
